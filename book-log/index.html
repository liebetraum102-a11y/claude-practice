<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 독서기록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>📚 나의 독서기록</h1>
  </header>

  <main>
    <!-- 책 추가 칸 -->
    <section>
      <h2>책 추가하기</h2>
      <form id="book-form">
        <label for="title">제목</label>
        <input type="text" id="title" required>

        <label for="author">작가</label>
        <input type="text" id="author" required>

        <label for="rating">평점</label>
        <select id="rating">
          <option value="">선택 안 함</option>
          <option value="5">★★★★★ (5)</option>
          <option value="4">★★★★ (4)</option>
          <option value="3">★★★ (3)</option>
          <option value="2">★★ (2)</option>
          <option value="1">★ (1)</option>
        </select>

        <label for="review">한줄평</label>
        <input type="text" id="review">

        <label for="tags">태그 (쉼표로 구분)</label>
        <input type="text" id="tags" placeholder="예: 인생책, 소설">

        <button type="submit">추가</button>
      </form>
    </section>

    <!-- 책 목록이 들어갈 자리 -->
    <section>
      <h2>읽은 책 목록</h2>
      <ul id="book-list"></ul>
    </section>

    <!-- 백업: 브라우저에 저장된 목록을 파일로 내보내거나, 파일에서 다시 불러온다 -->
    <section>
      <h2>데이터 백업</h2>
      <button type="button" id="export-button">데이터 내보내기</button>
      <button type="button" id="import-button">데이터 가져오기</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p>내보내기는 지금 목록을 books.json 파일로 내려받고, 가져오기는 그 파일로 목록을 통째로 바꿔요.</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
